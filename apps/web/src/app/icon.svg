    <path d="M8.5 24h15" stroke-opacity=".28" stroke-width="1.4" />
    <path d="M16 24 24.4 9.8" stroke-width="2.1" />
  </g>
  <circle cx="22.3" cy="12.4" r="2.5" fill="#dd9340" />
</svg>
