    <path d="M6 24a12 12 0 0 1 20-9" stroke-opacity=".38" stroke-width="1.5" />
    <path d="M11 24a7 7 0 0 1 10.6-6" stroke-opacity=".6" stroke-width="1.5" />
    <path d="M8.5 24h15" stroke="#566377" stroke-opacity=".7" stroke-width="1.2" />
    <path d="M16 24 24.4 9.8" stroke="#A7C7F7" stroke-width="2" />
  </g>
  <circle cx="22.3" cy="12.4" r="3.4" fill="#4F7CD9" fill-opacity=".28" />
